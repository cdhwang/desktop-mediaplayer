<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Desktop Music Remote</title>
<style>
  :root {
    --bg: #15171c;
    --panel: #1e2128;
    --panel2: #272b34;
    --fg: #e8eaed;
    --muted: #9aa0aa;
    --accent: #4c8dff;
    --accent2: #2f6fd6;
    --playing: #223a66;
    --border: #333843;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%;
  }
  body { display: flex; flex-direction: column; max-width: 680px; margin: 0 auto; }
  header {
    padding: 14px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  .conn { font-size: 12px; color: var(--muted); }
  .conn.ok { color: #58d68d; }
  .conn.bad { color: #e67e7e; }
  .conn.loading { color: var(--accent); }
  .now-title { font-size: 18px; font-weight: 600; margin-top: 4px; word-break: break-word; }
  .now-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .now-cover-wrap { display: flex; justify-content: center; margin-top: 12px; }
  .now-cover {
    width: 260px; height: 260px; border-radius: 14px; object-fit: cover;
    background: var(--panel2); border: 1px solid var(--border);
    display: none;
  }
  .now-cover.show { display: block; }
  .seek-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .time { font-size: 12px; color: var(--muted); width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .controls { padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .row { display: flex; gap: 6px; justify-content: center; align-items: center; margin: 8px 0; }
  button {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 8px; font-size: 15px; cursor: pointer;
    min-width: 44px; min-height: 44px; transition: background .12s, border-color .12s;
  }
  button:active { background: var(--accent2); }
  button.flex { flex: 1; }
  button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  button.toggled { border-color: var(--accent); color: var(--accent); }
  /* Muted is a distinct, filled "warning" state so it's obvious at a glance
     and not confused with the accent-outline of shuffle/repeat toggles. */
  button#btnMute.muted {
    background: #5a2730; border-color: #e67e7e; color: #ffd9d9; font-weight: 600;
  }
  .vol-row { display: flex; align-items: center; gap: 8px; }
  .vol-row input[type=range] { flex: 1; }
  .vol-val { width: 36px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .list { flex: 1; overflow-y: auto; padding: 6px 10px 20px; }
  .track {
    display: flex; align-items: center; gap: 10px; padding: 12px 12px;
    border-radius: 10px; border: 1px solid transparent; cursor: pointer;
  }
  .track:active { background: var(--panel2); }
  .track.playing { background: var(--playing); border-color: var(--accent2); }
  .track .idx { color: var(--muted); width: 26px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .track .thumb {
    width: 40px; height: 40px; border-radius: 6px; object-fit: cover;
    background: var(--panel2); flex: 0 0 auto;
  }
  .track .meta { flex: 1; min-width: 0; }
  .track .t { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track .a { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track .dur { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .track .del {
    flex: 0 0 auto; min-width: 32px; min-height: 32px; padding: 4px 8px;
    font-size: 15px; line-height: 1; border-radius: 8px; color: var(--muted);
    background: transparent; border: 1px solid transparent;
  }
  .track .del:hover, .track .del:active { color: #e67e7e; border-color: var(--border); background: var(--panel2); }
  .eq { color: var(--accent); font-size: 14px; }
  .listen-note { font-size: 12px; color: var(--muted); text-align: center; min-height: 16px; padding: 2px 8px; }
  .listen-note.bad { color: #e67e7e; }
  .section-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 8px 12px 2px; }
</style>
</head>
<body>
  <!-- The real audio player. Hidden; the browser is the sole audio source
       while the desktop stays muted in remote mode. -->
  <audio id="audioEl" preload="auto" style="display:none"></audio>

  <header>
    <div class="conn" id="conn">connecting…</div>
    <div class="now-title" id="nowTitle">—</div>
    <div class="now-sub" id="nowSub"></div>
    <div class="now-cover-wrap">
      <img class="now-cover" id="nowCover" alt="">
    </div>
    <div class="seek-row">
      <span class="time" id="curTime">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0">
      <span class="time" id="durTime">0:00</span>
    </div>
  </header>

  <div class="controls">
    <div class="row">
      <button id="btnPrev" title="Previous">⏮</button>
      <button id="btnPlay" class="primary" title="Play/Pause">⏯</button>
      <button id="btnNext" title="Next">⏭</button>
      <button id="btnStop" title="Stop">⏹</button>
      <button id="btnMute" title="Mute">🔊</button>
      <button id="btnShuffle" title="Shuffle">🔀</button>
      <button id="btnRepeat" title="Repeat">🔁</button>
    </div>
    <div class="row vol-row">
      <input type="range" id="vol" min="0" max="100" value="100">
      <span class="vol-val" id="volVal">100</span>
    </div>
    <div class="row">
      <button id="btnListen" class="flex" title="Play the audio in this browser">🎧 Listen here</button>
    </div>
    <div class="listen-note" id="listenNote"></div>
  </div>

  <div class="section-label">Playlist</div>
  <div class="list" id="list"></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var audio = $("audioEl");

  // ── state ────────────────────────────────────────────────────────────────
  var seeking = false;        // user dragging the seek bar
  var volDragging = false;    // user dragging the volume slider
  var lastPlaylistSig = "";
  var loadedIndex = -1;       // index currently loaded into <audio>
  var loadedSig = "";         // identity of the loaded track
  var userVolume = 1.0;
  var muted = false;
  var loading = false;
  var pendingSeekMs = 0;

  // desktop-source position mirror (used when !claimed)
  var desktopPos = 0;         // ms, updated from WS push
  var desktopLen = 0;         // ms
  var desktopState = "";      // "playing" | "paused" | …
  var desktopLastSync = 0;    // Date.now() when desktopPos was last set from WS

  // Audio-claim (Listen here)
  var claimed = false;
  var audioToken = null;
  var claimPending = false;

  // Drift-correction interval for browser audio (ms). The server pushes a
  // position sync every ~10 s via WS; the browser applies it only when not
  // actively playing (to avoid a seek jump) or when drift > threshold.
  var DRIFT_THRESHOLD_MS = 3000;

  // Heartbeat: POST /api/remote/state keeps the claim alive and optionally
  // carries position. Full position sync every 10 s; heartbeat-only in between.
  var REPORT_SYNC_INTERVAL_MS = 10000;
  var lastFullReportMs = 0;

  // WebSocket reconnect
  var ws = null;
  var wsReconnectTimer = null;
  var wsReconnectDelay = 1500; // ms, doubles on repeated failure up to 16 s

  // ── helpers ──────────────────────────────────────────────────────────────
  function genToken() {
    try { if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID(); }
    catch (e) {}
    return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  function fmt(ms) {
    ms = Math.max(0, ms | 0);
    var s = Math.floor(ms / 1000), m = Math.floor(s / 60);
    s = s % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function post(path, body) {
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (s) {
      // POST responses carry a fresh state snapshot; apply it so the UI
      // reflects the change immediately without waiting for the next WS push.
      applyState(s);
    }).catch(function () {});
  }

  function postQuiet(path, body) {
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    }).catch(function () {});
  }

  function command(id) { return post("/api/command/" + id); }

  function setConn(kind, detail) {
    var el = $("conn");
    if (kind === "loading") { el.textContent = "loading track…"; el.className = "conn loading"; }
    else if (kind === "ok")  { el.textContent = "connected";       el.className = "conn ok"; }
    else                     { el.textContent = detail || "disconnected — retrying…"; el.className = "conn bad"; }
  }

  // ── WebSocket ─────────────────────────────────────────────────────────────
  function wsUrl() {
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    return proto + "//" + location.host + "/ws";
  }

  function wsConnect() {
    if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
    try { ws = new WebSocket(wsUrl()); } catch (e) { wsScheduleReconnect(); return; }

    ws.onopen = function () {
      wsReconnectDelay = 1500;   // reset backoff on success
      setConn("ok");
    };

    ws.onmessage = function (ev) {
      var s;
      try { s = JSON.parse(ev.data); } catch (e) { return; }
      applyState(s);
      if (s.playlist) renderPlaylist(s.playlist);
    };

    ws.onclose = function () {
      ws = null;
      setConn("bad");
      // If this browser was playing audio (claimed), stop it now: the desktop
      // is gone so there is no one to resume from, and continuing to play
      // silently with no server would be confusing.
      if (claimed) {
        audio.pause();
        claimed = false;
        audioToken = null;
        updateListenButton();
        setListenNote("Connection lost — playback stopped.", true);
      }
      wsScheduleReconnect();
    };

    ws.onerror = function () {
      // onclose fires right after onerror; scheduling reconnect there is enough
    };
  }

  function wsScheduleReconnect() {
    if (wsReconnectTimer) return;
    wsReconnectTimer = setTimeout(function () {
      wsReconnectTimer = null;
      wsConnect();
    }, wsReconnectDelay);
    // Exponential backoff capped at 16 s
    wsReconnectDelay = Math.min(wsReconnectDelay * 2, 16000);
  }

  // ── UI helpers ────────────────────────────────────────────────────────────
  function setListenNote(msg, bad) {
    var el = $("listenNote");
    el.textContent = msg || "";
    el.className = "listen-note" + (bad ? " bad" : "");
  }

  function updateMuteButton() {
    var btn = $("btnMute");
    btn.classList.toggle("muted", muted);
    btn.textContent = muted ? "🔇" : "🔊";
    btn.setAttribute("aria-pressed", muted ? "true" : "false");
    btn.setAttribute("title", muted ? "Unmute" : "Mute");
  }

  function updateListenButton() {
    var btn = $("btnListen");
    btn.classList.toggle("toggled", claimed);
    btn.textContent = claimed ? "🎧 Listening here" : "🎧 Listen here";
  }

  // ── audio claim ───────────────────────────────────────────────────────────
  function claimAudio() {
    if (claimPending || claimed) return;
    claimPending = true;
    if (!audioToken) audioToken = genToken();
    fetch("/api/audio/claim", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: audioToken })
    }).then(function (r) {
      if (r.status === 409) {
        claimPending = false;
        setListenNote("Another device is already listening.", true);
        return null;
      }
      if (!r.ok) { claimPending = false; setListenNote("Could not start listening.", true); return null; }
      return r.json();
    }).then(function (s) {
      if (!s) return;
      claimed = true; claimPending = false;
      audio.muted = false; muted = false;
      setListenNote(""); updateListenButton(); updateMuteButton();
      applyState(s);
      if (typeof s.current_index === "number" && s.current_index >= 0) {
        var resumeMs = (typeof s.resume_ms === "number") ? s.resume_ms : 0;
        var autoplay = (s.resume_playing !== false);
        loadIndex(s.current_index, autoplay, trackSig(s.current), resumeMs);
      }
    }).catch(function () { claimPending = false; setListenNote("Could not start listening.", true); });
  }

  function releaseAudio(useBeacon) {
    if (!audioToken) { claimed = false; updateListenButton(); return; }
    var body = JSON.stringify({ token: audioToken });
    if (useBeacon && navigator.sendBeacon) {
      try { navigator.sendBeacon("/api/audio/release", new Blob([body], { type: "application/json" })); } catch (e) {}
    } else {
      fetch("/api/audio/release", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: body
      }).then(function (r) { return r.ok ? r.json() : null; })
        .then(function (s) { if (s) applyState(s); })
        .catch(function () {});
    }
    claimed = false; audio.pause(); setListenNote(""); updateListenButton();
  }

  function toggleListen() { if (claimed) releaseAudio(false); else claimAudio(); }

  // ── audio element ─────────────────────────────────────────────────────────
  function trackSig(t) {
    if (!t) return "";
    return [t.title || "", t.artist || "", t.duration_ms || 0,
            t.is_cue_track ? 1 : 0].join("|");
  }

  function loadIndex(index, autoplay, sig, seekMs) {
    if (index < 0 || !claimed) return;
    loadedIndex = index; loadedSig = sig || "";
    loading = true; setConn("loading");
    pendingSeekMs = (seekMs && seekMs > 0) ? seekMs : 0;
    audio.src = "/api/audio/" + index;
    audio.load();
    if (autoplay) { var p = audio.play(); if (p && p.catch) p.catch(function () {}); }
  }

  function togglePlay() {
    if (!claimed) { command("play_pause"); return; }
    if (loadedIndex < 0) {
      // Nothing loaded: fetch current state once then load.
      fetch("/api/state").then(function (r) { return r.json(); })
        .then(function (s) {
          if (s && s.current_index >= 0) loadIndex(s.current_index, true, trackSig(s.current));
        }).catch(function () {});
      return;
    }
    if (audio.paused) { var p = audio.play(); if (p && p.catch) p.catch(function () {}); }
    else audio.pause();
  }

  // Heartbeat + periodic position sync sent to the desktop while claimed.
  function reportState(forceSync) {
    if (!claimed || !audioToken) return;
    var state = loading ? "buffering" : audio.ended ? "ended" : audio.paused ? "paused" : "playing";
    var now = Date.now();
    var needSync = forceSync || lastFullReportMs === 0
                || (now - lastFullReportMs) >= REPORT_SYNC_INTERVAL_MS
                || state !== "playing";
    if (needSync) {
      lastFullReportMs = now;
      postQuiet("/api/remote/state", {
        token: audioToken,
        position_ms: Math.round((audio.currentTime || 0) * 1000),
        length_ms:   Math.round((isFinite(audio.duration) ? audio.duration : 0) * 1000),
        state: state
      });
    } else {
      postQuiet("/api/remote/state", { token: audioToken, position_ms: -1, length_ms: -1, state: state });
    }
  }

  // Seek bar driven by <audio> timeupdate while claimed.
  function updateProgress() {
    var dur = isFinite(audio.duration) ? audio.duration : 0;
    var pos = audio.currentTime || 0;
    $("seek").value  = dur > 0 ? Math.round((pos / dur) * 1000) : 0;
    $("curTime").textContent = fmt(pos * 1000);
    $("durTime").textContent = fmt(dur * 1000);
  }

  // Advance desktop position estimate locally (called by rAF loop when !claimed).
  var rafId = null;
  function startDesktopTick() {
    if (rafId) return;
    (function tick() {
      if (!claimed && desktopState === "playing") {
        var elapsed = Date.now() - desktopLastSync;
        var pos = desktopPos + elapsed;
        if (!seeking && desktopLen > 0) {
          $("seek").value  = Math.round((pos / desktopLen) * 1000);
          $("curTime").textContent = fmt(pos);
          $("durTime").textContent = fmt(desktopLen);
        }
      }
      rafId = requestAnimationFrame(tick);
    })();
  }

  audio.addEventListener("loadedmetadata", function () {
    loading = false; setConn("ok");
    if (pendingSeekMs > 0) {
      var dur = isFinite(audio.duration) ? audio.duration : 0;
      var target = pendingSeekMs / 1000;
      if (dur > 0) target = Math.min(target, Math.max(0, dur - 0.25));
      try { audio.currentTime = target; } catch (e) {}
      pendingSeekMs = 0;
    }
    updateProgress();
  });
  audio.addEventListener("canplay",    function () { loading = false; setConn("ok"); });
  audio.addEventListener("waiting",    function () { loading = true;  setConn("loading"); });
  audio.addEventListener("playing",    function () { loading = false; setConn("ok"); });
  audio.addEventListener("timeupdate", function () { if (!seeking) updateProgress(); });
  audio.addEventListener("play",       function () { $("btnPlay").textContent = "⏸"; reportState(true); });
  audio.addEventListener("pause",      function () { $("btnPlay").textContent = "▶";  reportState(true); });
  audio.addEventListener("ended",      function () { reportState(true); command("next"); });
  audio.addEventListener("error",      function () { loading = false; setConn("bad"); });

  // ── state rendering ───────────────────────────────────────────────────────
  function applyState(s) {
    if (!s) return;
    if (!loading) setConn("ok");

    var cur = s.current;
    $("nowTitle").textContent = cur ? cur.title : "Nothing playing";
    $("nowSub").textContent   = (cur && cur.artist) ? cur.artist : "";

    // Track follow: reload only when track identity changes.
    if (typeof s.current_index === "number" && s.current_index >= 0) {
      var sig = trackSig(s.current);
      if (claimed) {
        if (loadedIndex < 0 || sig !== loadedSig) {
          loadIndex(s.current_index, true, sig);
        } else if (s.current_index !== loadedIndex) {
          loadedIndex = s.current_index;
        }
      }
    } else if (s.current_index < 0 && claimed) {
      loadedIndex = -1; loadedSig = "";
    }

    // Volume (skip while slider is being dragged).
    if (!volDragging) {
      $("vol").value = s.volume;
      $("volVal").textContent = s.volume;
      userVolume = Math.max(0, Math.min(1, s.volume / 100));
      audio.volume = userVolume;
    }

    // Mute: respect claimed/claimPending guard to avoid desktop mute leaking.
    if (!claimed && !claimPending) {
      muted = !!s.muted; audio.muted = muted;
    } else {
      muted = audio.muted;
    }
    updateMuteButton();

    // Shuffle / repeat.
    $("btnShuffle").classList.toggle("toggled", !!s.shuffle);
    var rep = s.repeat || "none";
    var repBtn = $("btnRepeat");
    repBtn.classList.toggle("toggled", rep !== "none");
    repBtn.textContent = rep === "one" ? "🔂" : "🔁";
    repBtn.setAttribute("title", rep === "one" ? "Repeat 1" : rep === "all" ? "Repeat All" : "Repeat");

    updateNowCover(cur, s.current_index);

    // Claim expired on the server side.
    if (claimed && s.remote_mode === false) {
      claimed = false; audio.pause(); updateListenButton();
      setListenNote("Another device took over, or the claim expired.", true);
    }

    // ── Position / seek bar ──────────────────────────────────────────────
    if (!claimed) {
      // Desktop is the audio source. Mirror play state from WS push.
      $("btnPlay").textContent = (s.state === "playing") ? "⏸" : "▶";

      // Store the desktop's position with a local timestamp so the rAF tick
      // can interpolate between WS pushes (every ~10 s during play).
      if (typeof s.position_ms === "number" && s.position_ms >= 0) {
        desktopPos      = s.position_ms;
        desktopLen      = s.length_ms || 0;
        desktopState    = s.state || "";
        desktopLastSync = Date.now();
        // Snap the seek bar immediately on every WS push.
        if (!seeking) {
          $("seek").value  = desktopLen > 0 ? Math.round((desktopPos / desktopLen) * 1000) : 0;
          $("curTime").textContent = fmt(desktopPos);
          $("durTime").textContent = fmt(desktopLen);
        }
      } else {
        // Heartbeat-only push (position_ms omitted or -1): only update state label.
        desktopState = s.state || desktopState;
        $("btnPlay").textContent = (desktopState === "playing") ? "⏸" : "▶";
      }
    } else {
      // Browser is the audio source.
      // Drift correction: WS push carries position_ms when a full sync is due
      // (every ~10 s from the server). Apply only when paused/buffering so we
      // never jump the seek bar while music is playing smoothly.
      if (typeof s.position_ms === "number" && s.position_ms >= 0) {
        if (!seeking && (audio.paused || loading)) {
          var spos = Math.max(0, s.position_ms | 0);
          var slen = Math.max(0, s.length_ms   | 0);
          $("seek").value  = slen > 0 ? Math.round((spos / slen) * 1000) : 0;
          $("curTime").textContent = fmt(spos);
          $("durTime").textContent = fmt(slen);
        }
      }
    }

    if (s.playlist) renderPlaylist(s.playlist);
    if (typeof s.current_index === "number") highlightPlaying(s.current_index);
  }

  function updateNowCover(cur, idx) {
    var img = $("nowCover");
    if (cur && cur.has_cover && idx >= 0) {
      var sig = trackSig(cur);
      if (img.getAttribute("data-sig") !== sig) {
        img.setAttribute("data-sig", sig);
        img.src = "/api/cover/" + idx + "?t=" + encodeURIComponent(sig);
      }
      img.classList.add("show");
    } else {
      img.classList.remove("show");
      img.removeAttribute("src");
      img.removeAttribute("data-sig");
    }
  }

  function highlightPlaying(idx) {
    document.querySelectorAll(".track").forEach(function (row) {
      row.classList.toggle("playing", parseInt(row.getAttribute("data-index"), 10) === idx);
    });
  }

  function renderPlaylist(pl) {
    if (!pl) return;
    var sig = pl.count + ":" + pl.tracks.map(function (t) {
      return trackSig(t) + (t.has_cover ? "*" : "");
    }).join("|");
    if (sig === lastPlaylistSig) { highlightPlaying(pl.current_index); return; }
    lastPlaylistSig = sig;
    var list = $("list");
    list.innerHTML = "";
    pl.tracks.forEach(function (t) {
      var row  = document.createElement("div");
      row.className = "track" + (t.playing ? " playing" : "");
      row.setAttribute("data-index", t.index);

      var numEl = document.createElement("div");
      numEl.className = "idx"; numEl.textContent = t.index + 1;

      var thumb = null;
      if (t.has_cover) {
        thumb = document.createElement("img");
        thumb.className = "thumb"; thumb.alt = "";
        thumb.src = "/api/cover/" + t.index + "?t=" + encodeURIComponent(trackSig(t));
      }

      var meta  = document.createElement("div"); meta.className = "meta";
      var title = document.createElement("div"); title.className = "t"; title.textContent = t.title;
      meta.appendChild(title);
      if (t.artist) {
        var artist = document.createElement("div"); artist.className = "a"; artist.textContent = t.artist;
        meta.appendChild(artist);
      }

      var dur = document.createElement("div");
      dur.className = "dur"; dur.textContent = t.duration_ms ? fmt(t.duration_ms) : "";

      var del = document.createElement("button");
      del.className = "del"; del.setAttribute("title", "Remove"); del.setAttribute("aria-label", "Remove");
      del.textContent = "✕";
      del.addEventListener("click", function (ev) {
        ev.stopPropagation();
        post("/api/remove", { index: t.index });
      });

      row.appendChild(numEl);
      if (thumb) row.appendChild(thumb);
      row.appendChild(meta); row.appendChild(dur); row.appendChild(del);
      row.addEventListener("click", function () {
        loadIndex(t.index, true, trackSig(t));
        post("/api/play", { index: t.index });
      });
      list.appendChild(row);
    });
  }

  // ── button wiring ─────────────────────────────────────────────────────────
  $("btnPlay").addEventListener("click",    togglePlay);
  $("btnPrev").addEventListener("click",    function () { command("previous"); });
  $("btnNext").addEventListener("click",    function () { command("next"); });
  $("btnStop").addEventListener("click",    function () {
    audio.pause(); audio.currentTime = 0; reportState(true); command("stop");
  });
  $("btnMute").addEventListener("click",    function () {
    muted = !muted; audio.muted = muted; updateMuteButton();
    if (!claimed) command("mute");
  });
  $("btnShuffle").addEventListener("click", function () { command("toggle_shuffle"); });
  $("btnRepeat").addEventListener("click",  function () { command("cycle_repeat"); });
  $("btnListen").addEventListener("click",  toggleListen);

  window.addEventListener("pagehide",      function () { if (claimed) releaseAudio(true); });
  window.addEventListener("beforeunload",  function () { if (claimed) releaseAudio(true); });

  // Seek bar
  $("seek").addEventListener("input",  function () { seeking = true; });
  $("seek").addEventListener("change", function () {
    var fraction = Math.max(0, Math.min(1, ($("seek").value || 0) / 1000));
    if (claimed) {
      var dur = isFinite(audio.duration) ? audio.duration : 0;
      if (dur > 0) audio.currentTime = fraction * dur;
      reportState(true);
    } else {
      post("/api/seek", { fraction: fraction });
    }
    setTimeout(function () { seeking = false; }, 200);
  });

  // Volume slider
  $("vol").addEventListener("input",  function () {
    volDragging = true;
    $("volVal").textContent = $("vol").value;
    userVolume = Math.max(0, Math.min(1, $("vol").value / 100));
    audio.volume = userVolume;
  });
  $("vol").addEventListener("change", function () {
    post("/api/volume", { value: parseInt($("vol").value, 10) });
    setTimeout(function () { volDragging = false; }, 400);
  });

  // Heartbeat timer (keeps claim alive; sends full sync every 10 s)
  setInterval(reportState, 1000);

  // rAF loop for smooth desktop-source seek bar interpolation
  startDesktopTick();

  // Start WebSocket
  wsConnect();
  updateListenButton();
  updateMuteButton();
})();
</script>
</body>
</html>
